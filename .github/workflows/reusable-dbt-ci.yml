
name: Reusable dbt CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  dbt-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pharma_supply_chain/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pharma_supply_chain/requirements.txt

      - name: Create CI profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          pharma_supply_chain:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: placeholder-account
                user: placeholder-user
                password: placeholder-password
                role: ACCOUNTADMIN
                database: PHARMA_SUPPLY_CHAIN
                warehouse: COMPUTE_WH
                schema: DBT_CI
                threads: 4
          EOF

      - name: Parse dbt project
        working-directory: pharma_supply_chain
        run: dbt parse
